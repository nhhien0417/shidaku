<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- user-scalable=no kills iOS double-tap zoom, which otherwise fires mid-drag.
         viewport-fit=cover is what makes env(safe-area-inset-*) return real numbers. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F4ED" />
    <meta name="description" content="Draw rectangles, reveal the picture. A Shidaku prototype." />
    <meta name="robots" content="noindex" />
    <title>Shidaku</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23F7F4ED'/><rect x='5' y='5' width='10' height='10' rx='3' fill='%23E2574C'/><rect x='17' y='5' width='10' height='10' rx='3' fill='%234A9DD9'/><rect x='5' y='17' width='22' height='10' rx='3' fill='%23F2C14E'/></svg>" />
  </head>
  <body>
    <!-- The board. One canvas, no per-cell DOM. -->
    <canvas id="board"></canvas>

    <!-- Screen-space HUD. Pointer-transparent except for the controls themselves, so a drag
         that starts near a button still reaches the board. -->
    <div id="hud">
      <header id="topbar">
        <div id="level-label">Level 1</div>
        <button id="mute-btn" class="icon-btn" type="button" aria-label="Toggle sound">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 10v4h3l4 3.5V6.5L7 10H4z"
              fill="currentColor"
            />
            <path id="mute-wave" d="M14.5 9.2a4 4 0 0 1 0 5.6M17 7a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" />
            <path id="mute-cross" d="M15 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" hidden />
          </svg>
        </button>
      </header>

      <!-- Tutorial: three steps, three dots, and nothing else on screen. -->
      <section id="tutorial-banner" hidden>
        <p id="tutorial-text"></p>
        <p id="tutorial-note"></p>
        <div id="tutorial-dots"><i></i><i></i><i></i></div>
      </section>

      <div id="progress">Progress: 0%</div>
      <div id="tap-hint">Tap anywhere to continue</div>

      <footer id="bottombar">
        <button id="overview-btn" class="round-btn" type="button" aria-label="See the whole picture">
          <canvas id="minimap" width="16" height="16"></canvas>
        </button>
        <button id="hint-btn" class="round-btn" type="button" aria-label="Hint">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3a6 6 0 0 0-3.3 11v2.2a1 1 0 0 0 1 1h4.6a1 1 0 0 0 1-1V14A6 6 0 0 0 12 3z"
              fill="currentColor"
              opacity="0.9"
            />
            <rect x="9.7" y="18.2" width="4.6" height="2.4" rx="1.2" fill="currentColor" />
          </svg>
          <span id="hint-label">Hint</span>
        </button>
      </footer>

      <!-- Fake-install placement 1: a soft banner after section 3. Never blocks play; hides
           itself after 6s if ignored. -->
      <aside id="install-banner" hidden>
        <div id="install-banner-text">Want to keep painting?</div>
        <a id="install-banner-cta" href="soon/">Get the full game</a>
        <button id="install-banner-close" type="button" aria-label="Dismiss">&times;</button>
      </aside>

      <!-- Picture complete. Background is nearly transparent on purpose: the finished picture
           is the reward, and a solid panel would cover it up. -->
      <div id="win-overlay" hidden>
        <div id="win-card">
          <h1 id="win-title">Brilliant!</h1>
          <p id="win-sub">A true artist's touch.</p>
          <button id="next-btn" type="button">Next Picture</button>
          <a id="win-install" href="soon/">Get the full game</a>
        </div>
      </div>

      <div id="end-overlay" hidden>
        <div id="win-card">
          <h1>That's all of it.</h1>
          <p>You finished every picture in this preview.</p>
          <a id="end-install" class="primary-link" href="soon/">Get the full game</a>
        </div>
      </div>

      <div id="boot-error" hidden>
        <div id="win-card">
          <h1>Hmm.</h1>
          <p id="boot-error-text">Something failed to load.</p>
        </div>
      </div>
    </div>

    <pre id="debug" hidden></pre>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
